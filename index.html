<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛР3 — Вариант 5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progressBar"></div>
  
  <header class="header">
    <h1>Вариант 5: Гистограммы и Порядковые статистики</h1>
    <div class="actions">
      <label class="btn btn-primary" for="fileInput">Загрузить фото</label>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button class="btn btn-outline" id="downloadBtn">Скачать результат</button>
    </div>
  </header>

  <main class="container">
    <aside class="sidebar">
      <div class="card">
        <h3>1. Тестовые фото</h3>
        <div class="preset-list" id="presetGrid">
          <button class="preset-btn active" data-preset="lowContrast">Малоконтрастное (Для гистограмм)</button>
          <button class="preset-btn" data-preset="saltPepper">Шум "Соль и перец" (Для медианы)</button>
        </div>
      </div>

      <div class="card">
        <h3>2. Метод обработки</h3>
        <select id="methodSelect" class="input-element">
          <optgroup label="Гистограммы и Контраст (Строка 1)">
            <option value="linear">Линейное контрастирование</option>
            <option value="eqRGB">Эквализация (RGB)</option>
            <option value="eqHSV">Эквализация (HSV - только яркость)</option>
            <option value="clahe">CLAHE (Адаптивная эквализация)</option>
          </optgroup>
          <optgroup label="Порядковые статистики (Столбец 5)">
            <option value="median">Медианный фильтр (Шум)</option>
            <option value="min">Фильтр минимума (Эрозия)</option>
            <option value="max">Фильтр максимума (Дилатация)</option>
          </optgroup>
        </select>

        <div id="dynamicControls" class="controls-area"></div>
        
        <select id="paddingSelect" class="input-element">
          <option value="clamp">Обработка краев: Clamp (Дублирование)</option>
          <option value="reflect">Обработка краев: Reflect (Отражение)</option>
        </select>
        
        <button class="btn btn-accent full-width" id="applyBtn" style="margin-top: 10px;">Применить метод</button>
      </div>
    </aside>

    <section class="workspace">
      <div class="image-grid">
        <div class="card view-box">
          <div class="box-header">До (<span id="srcMeta"></span>)</div>
          <canvas id="srcCanvas"></canvas>
          <div class="stats" id="srcStats"></div>
          <canvas id="srcHistCanvas" class="hist-canvas"></canvas>
        </div>

        <div class="card view-box">
          <div class="box-header">После <span id="perfInfo" class="badge"></span></div>
          <canvas id="dstCanvas"></canvas>
          <div class="stats" id="dstStats"></div>
          <canvas id="dstHistCanvas" class="hist-canvas"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script src="buffer.js"></script>
  <script src="algorithms.js"></script>
  <script src="ui.js"></script>
</body>
</html>
