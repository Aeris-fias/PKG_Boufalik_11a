<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛР3 — Пороговая обработка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progressBar"></div>
  
  <header class="header">
    <h1>Пороговая обработка (Оцу и Изодата)</h1>
    <div class="actions">
      <label class="btn btn-primary" for="fileInput">Загрузить фото</label>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button class="btn btn-outline" id="downloadBtn">Скачать результат</button>
    </div>
  </header>

  <main class="container">
    <aside class="sidebar">
      <div class="card">
        <h3>1. Тестовые фото</h3>
        <div class="preset-list" id="presetGrid">
          <button class="preset-btn active" data-preset="document">Тестовый документ</button>
          <button class="preset-btn" data-preset="shapes">Геометрические фигуры</button>
        </div>
      </div>

      <div class="card">
        <h3>2. Метод бинаризации</h3>
        <select id="methodSelect" class="input-element">
          <option value="otsu">Глобальный порог: Метод Оцу</option>
          <option value="isodata">Глобальный порог: Метод Изодата</option>
        </select>
        
        <button class="btn btn-accent full-width" id="applyBtn" style="margin-top: 10px;">Применить порог</button>
      </div>
    </aside>

    <section class="workspace">
      <div class="image-grid">
        <div class="card view-box">
          <div class="box-header">До (<span id="srcMeta"></span>)</div>
          <canvas id="srcCanvas"></canvas>
          <div class="stats" id="srcStats"></div>
          <canvas id="srcHistCanvas" class="hist-canvas"></canvas>
        </div>

        <div class="card view-box">
          <div class="box-header">После <span id="perfInfo" class="badge"></span></div>
          <canvas id="dstCanvas"></canvas>
          <div class="stats" id="dstStats"></div>
          <canvas id="dstHistCanvas" class="hist-canvas"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script src="buffer.js"></script>
  <script src="algorithms.js"></script>
  <script src="ui.js"></script>
</body>
</html>
