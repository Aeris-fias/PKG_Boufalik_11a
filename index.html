<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обработка изображений</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progressBar"></div>
  
  <header class="header">
    <h1>Обработка цифровых изображений</h1>
    <div class="actions">
      <label class="btn btn-primary" for="fileInput">Загрузить свое фото</label>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button class="btn btn-outline" id="downloadBtn">Скачать результат</button>
    </div>
  </header>

  <main class="container">
    <aside class="sidebar">
      <div class="card">
        <h3>1. Тестовые фото</h3>
        <div class="preset-list" id="presetGrid">
          <button class="preset-btn active" data-preset="lowContrast">Малоконтрастное (CLAHE)</button>
          <button class="preset-btn" data-preset="saltPepper">Зашумленное (Медиана)</button>
          <button class="preset-btn" data-preset="unevenText">Текст в тени (Пороги)</button>
          <button class="preset-btn" data-preset="edgesShapes">Контуры (Собель/Кэнни)</button>
          <button class="preset-btn" data-preset="morphology">Детали (Морфология)</button>
          <button class="preset-btn" data-preset="colorCast">Цвет (Эквализация)</button>
        </div>
      </div>

      <div class="card">
        <h3>2. Настройки алгоритма</h3>
        <select id="methodSelect" class="input-element"></select>
        
        <div id="dynamicControls" class="controls-area"></div>
        
        <select id="paddingSelect" class="input-element">
          <option value="reflect">Обработка краев: Зеркально (Reflect)</option>
          <option value="clamp">Обработка краев: Дублирование (Clamp)</option>
        </select>
        
        <label class="checkbox-label">
          <input type="checkbox" id="useWorkersCheck" checked>
          Ускорение потоками (Web Workers)
        </label>
        
        <button class="btn btn-accent full-width" id="applyBtn">Применить алгоритм</button>
      </div>
    </aside>

    <section class="workspace">
      <div class="image-grid">
        <div class="card view-box">
          <div class="box-header">До (<span id="srcMeta"></span>)</div>
          <canvas id="srcCanvas"></canvas>
          <div class="stats" id="srcStats"></div>
          <canvas id="srcHistCanvas" class="hist-canvas"></canvas>
        </div>

        <div class="card view-box">
          <div class="box-header">После <span id="perfInfo" class="badge"></span></div>
          <canvas id="dstCanvas"></canvas>
          <div class="stats" id="dstStats"></div>
          <canvas id="dstHistCanvas" class="hist-canvas"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script src="buffer.js"></script>
  <script src="algorithms.js"></script>
  <script src="ui.js"></script>
</body>
</html>
